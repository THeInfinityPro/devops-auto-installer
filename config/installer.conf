#!/bin/bash

# ==========================================
# DevOps Auto Installer - Configuration
# ==========================================

# ==========================================
# Project
# ==========================================

PROJECT_NAME="DevOps Auto Installer"
PROJECT_VERSION="1.0.0"

# ==========================================
# Kubernetes
# ==========================================

KUBERNETES_MINOR_VERSION="1.36"

POD_CIDR="192.168.0.0/16"

# ==========================================
# Calico
# ==========================================

CALICO_VERSION="3.31.2"

# ==========================================
# Ports
# ==========================================

KUBERNETES_API_PORT="6443"
JENKINS_PORT="8080"
PROMETHEUS_PORT="9090"
GRAFANA_PORT="3000"

# ==========================================
# Services
# ==========================================

DOCKER_SERVICE="docker"
CONTAINERD_SERVICE="containerd"
KUBELET_SERVICE="kubelet"

JENKINS_SERVICE="jenkins"
PROMETHEUS_SERVICE="prometheus"
GRAFANA_SERVICE="grafana-server"

# ==========================================
# System Requirements
# ==========================================

MIN_CPU_CORES=2
MIN_RAM_MB=4096
MIN_DISK_GB=20

# ==========================================
# Prometheus
# ==========================================

PROMETHEUS_USER="prometheus"
PROMETHEUS_INSTALL_DIR="/opt/prometheus"
PROMETHEUS_CONFIG_DIR="/etc/prometheus"
PROMETHEUS_DATA_DIR="/var/lib/prometheus"

# ==========================================
# Jenkins
# ==========================================

JENKINS_HOME="/var/lib/jenkins"

# ==========================================
# Logging
# ==========================================

LOG_RETENTION_DAYS=30